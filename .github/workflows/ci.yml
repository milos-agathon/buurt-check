name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint-unit:
    name: Backend Lint + Unit
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          cd backend
          ruff check .

      - name: Pytest (non-live, non-visual, non-benchmark)
        run: |
          cd backend
          pytest -x -q -m "not live and not visual and not benchmark"

  backend-visual:
    name: Backend Visual Regression
    runs-on: ubuntu-latest
    needs:
      - backend-lint-unit

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install TinyTeX
        run: |
          wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          tlmgr --version

      - name: Install TeX packages
        run: |
          bash scripts/install-texlive.sh

      - name: Verify LuaLaTeX
        run: |
          lualatex --version

      - name: Pytest (visual)
        run: |
          cd backend
          pytest -x -q -m "visual"

  backend-benchmark:
    name: Backend Performance Benchmarks
    runs-on: ubuntu-latest
    needs:
      - backend-lint-unit

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install TinyTeX
        run: |
          wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          export PATH="$HOME/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          tlmgr --version

      - name: Install TeX packages
        run: |
          bash scripts/install-texlive.sh

      - name: Verify LuaLaTeX
        run: |
          lualatex --version

      - name: Pytest (benchmark)
        run: |
          cd backend
          pytest -x -q -m "benchmark"
