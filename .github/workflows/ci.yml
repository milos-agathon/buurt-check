name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-build-test:
    name: Frontend Build + Test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend build
        run: |
          cd frontend
          npm run build

      - name: Frontend test
        run: |
          cd frontend
          npm run test

  backend-lint-unit:
    name: Backend Lint + Unit
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          cd backend
          ruff check .

      - name: Pytest (non-live, non-visual, non-benchmark)
        run: |
          cd backend
          pytest -x -q -m "not live and not visual and not benchmark"

  backend-visual:
    name: Backend Visual Regression
    runs-on: ubuntu-latest
    needs:
      - backend-lint-unit

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install TeX packages
        env:
          BUURTCHECK_TEX_INSTALL_MODE: apt
        run: |
          bash scripts/install-texlive.sh

      - name: Verify LuaLaTeX
        run: |
          lualatex --version

      - name: Pytest (visual)
        run: |
          cd backend
          pytest -x -q -m "visual"

  backend-benchmark:
    name: Backend Performance Benchmarks
    runs-on: ubuntu-latest
    needs:
      - backend-lint-unit

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install TeX packages
        env:
          BUURTCHECK_TEX_INSTALL_MODE: apt
        run: |
          bash scripts/install-texlive.sh

      - name: Verify LuaLaTeX
        run: |
          lualatex --version

      - name: Pytest (benchmark)
        run: |
          cd backend
          pytest -x -q -m "benchmark"
