<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none" aria-label="Buurt-Check lockup horizontal">
  <!-- Inter SemiBold (SIL OFL). Ensure Inter is loaded where used. -->
  
  <defs>
    <g id="mark" fill="none">
      <!-- Parcel boundary -->
      <path d="M20 20 L20 80 L80 80" stroke="#1C2D3F" stroke-width="6.9" stroke-linecap="butt" stroke-linejoin="miter"/>
      <path d="M20 20 L74 20"       stroke="#1C2D3F" stroke-width="6"   stroke-linecap="butt" stroke-linejoin="miter"/>
      <path d="M74 20 L80 26"       stroke="#1C2D3F" stroke-width="6"   stroke-linecap="butt" stroke-linejoin="miter"/>
      <path d="M80 34 L80 80"       stroke="#1C2D3F" stroke-width="6"   stroke-linecap="butt" stroke-linejoin="miter"/>
      <!-- Checkmark -->
      <path d="M33 52 L46 65 L84 31" stroke="#2EC4B6"  stroke-width="12" stroke-linecap="butt" stroke-linejoin="bevel"/>
    </g>
  </defs>

  <g transform="translate(16 16) scale(0.4)">
    <use href="#mark"/>
  </g>
  <text x="70" y="44"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="600"
        letter-spacing="0.8"
        fill="#1C2D3F">Buurt-Check</text>
</svg>
