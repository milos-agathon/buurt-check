[project]
name = "buurt-check-backend"
version = "1.0.0"
description = "Backend for buurt-check: pre-viewing intelligence for property buyers in the Netherlands"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.0",
    "fpdf2>=2.7.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.9.0",
    "slowapi>=0.1.9",
    "aiosqlite>=0.20.0",
    "libsql>=0.1.11",
    "google-auth>=2.39.0",
    "stripe>=8.0.0",
    "app-store-server-library>=3.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
    "fonttools>=4.40.0",
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m \"not live and not visual and not benchmark\""
markers = [
    "live: tests that require network access to external APIs",
    "visual: visual regression tests requiring lualatex and baseline images",
    "benchmark: performance benchmark tests (latency, parallelization)",
    "turso: tests that exercise the Turso/libsql adapter path",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
