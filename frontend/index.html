<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Match with Dutch neighborhoods before checking a specific home address."
    />
    <meta name="theme-color" content="#F9FAFB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Buurt Check" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:url" content="https://buurt-check.nl" />
    <meta property="og:site_name" content="Buurt Check" />
    <meta property="og:title" content="Buurt Check | Neighborhood match" />
    <meta property="og:description" content="Match with Dutch neighborhoods before checking a specific home address." />
    <meta property="og:image" content="https://buurt-check.nl/og-image.png" />
    <meta property="og:image:secure_url" content="https://buurt-check.nl/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="Buurt Check neighborhood match preview." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Buurt Check | Neighborhood match" />
    <meta name="twitter:description" content="Match with Dutch neighborhoods before checking a specific home address." />
    <meta name="twitter:image" content="https://buurt-check.nl/og-image.png" />
    <meta name="twitter:image:alt" content="Buurt Check neighborhood match preview." />
    <title>Buurt Check | Neighborhood match</title>
    <link rel="icon" type="image/svg+xml" href="/logos/buurt-check-favicon.svg" />
    <link rel="apple-touch-icon" href="/logos/app_icons/AppIcon_Light.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F9FAFB;color:#171D1C;">
        <div style="max-width:420px;">
          <strong style="display:block;font-size:18px;margin-bottom:8px;">
            <span lang="nl">Buurt Check wordt geladen</span>
            <span aria-hidden="true"> / </span>
            <span lang="en">Buurt Check is loading</span>
          </strong>
          <span style="display:block;font-size:14px;line-height:1.5;color:#3D4947;">
            <span lang="nl">Als dit zichtbaar blijft, is de app niet gestart in deze browser.</span>
            <span aria-hidden="true"> / </span>
            <span lang="en">If this stays visible, the app did not start in this browser.</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
