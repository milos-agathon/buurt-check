<svg xmlns="http://www.w3.org/2000/svg" width="220" height="200" viewBox="0 0 220 200" fill="none" aria-label="Buurt Check">
  
  <style>
    @keyframes drawHouse {
      from { stroke-dashoffset: 230; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes revealCheck {
      from { clip-path: polygon(0% 100%, 0% 100%, 0% 100%); }
      to { clip-path: polygon(0% 100%, 200% 100%, 0% -100%); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .anim-house {
      stroke-dasharray: 230;
      stroke-dashoffset: 230;
      animation: drawHouse 0.3s ease-out forwards;
    }
    .anim-check {
      clip-path: polygon(0% 100%, 0% 100%, 0% 100%);
      animation: revealCheck 0.4s ease-out 0.4s forwards;
    }
    }
